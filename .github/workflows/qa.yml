name: QA · Maestro Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verificar Gherkin, trazabilidad y hooks
        run: |
          npm run --silent qa:check | tee qa-check.md
          cat qa-check.md >> "$GITHUB_STEP_SUMMARY"
      - run: npm run typecheck
      - run: npm run dry-run

  android:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar la app de prueba
        run: gradle --no-daemon :android-fixture:assembleDebug
      - name: Instalar Maestro CLI 2.12.1
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip \
            --output "$RUNNER_TEMP/qa-maestro.zip"
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  $RUNNER_TEMP/qa-maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/qa-maestro.zip" -d "$RUNNER_TEMP/qa-maestro"
          echo "$RUNNER_TEMP/qa-maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Habilitar aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ejecutar Cucumber y Maestro
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android-fixture/build/outputs/apk/debug/android-fixture-debug.apk
            npm test
      - name: Resumir resultados
        if: ${{ !cancelled() && hashFiles('allure-results/*-result.json') != '' }}
        run: npm run --silent qa:triage >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar reportes y diagnóstico
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-evidence
          path: |
            artifacts/maestro/
            allure-results/
          retention-days: 7
